<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{page-left-nav.html}">

<section layout:fragment="side-bar">
    <div class="prof-left-nav">
        <div class="row">
            <a href="/user/profile"><span class="section-title">Profile</span></a>
        </div>
        <div class="row">
            <a href="/user/reservations"><span class="section-title">Airport Parking Reservations</span></a>
        </div>
        <div class="row">
            <a href="/user/password"><span class="section-title">Change Password</span></a>
        </div>
    </div>
</section>

<section layout:fragment="main-content">
    <table class="table table-responsive capp-table-custom">
        <thead>
        <tr>
            <th scope="col">Order Number</th>
            <th scope="col">Departing Airport</th>
            <th scope="col">Drop Locations</th>
            <th scope="col">Reservation Status</th>
            <th scope="col">Details</th>
        </tr>
        </thead>
        <tbody>
            <div th:switch="${empty}">
                <div th:case="'true'">
                    <tr>
                        <td colspan="5" class="align-center capp-no-results">No Reservations Found</td>
                    </tr>
                </div>
                <div th:case="'false'">
                    <tr th:each="res : ${reservations}">
                        <th scope="row">1</th>
                        <td>Mark</td>
                        <td>Otto</td>
                        <td>@mdo</td>
                        <td>Otto</td>
                    </tr>
                </div>
            </div>
        </tbody>
    </table>

    <script>

    </script>
</section>
</html>
