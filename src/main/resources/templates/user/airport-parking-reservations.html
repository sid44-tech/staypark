<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{page-left-nav.html}">

<section layout:fragment="side-bar">
    <div class="prof-left-nav">
        <div class="row">
            <a href="/user/profile"><span class="section-title">Profile</span></a>
        </div>
        <div class="row">
            <a href="/user/reservations"><span class="section-title">Airport Parking Reservations</span></a>
        </div>
        <div class="row">
            <a href="/user/password"><span class="section-title">Change Password</span></a>
        </div>
    </div>
</section>

<section layout:fragment="main-content">
    <table class="table-sm table-responsive capp-table-custom">
        <thead>
        <tr>
            <th scope="col" class="th-font">Order Number</th>
            <th scope="col" class="th-font">Departing Airport</th>
            <th scope="col" class="th-font">Drop Locations</th>
            <th scope="col" class="th-font">Reservation Status</th>
        </tr>
        </thead>
        <tbody>
            <div th:switch="${empty}">
                <div th:case="'true'">
                    <tr>
                        <td colspan="5" class="align-center capp-no-results">No Reservations Found</td>
                    </tr>
                </div>
                <div th:case="'false'">
                    <tr th:each="res : ${reservations}">
                        <th scope="row" th:text="${res.orderNumber}" class="col-th-font"></th>
                        <td th:text="${res.departingAirport}" class="td-font"></td>
                        <td th:text="${res.dropLocation}" class="td-font"></td>
                        <td th:text="${res.reservationStatus}" class="td-font"></td>
                    </tr>
                </div>
            </div>
        </tbody>
    </table>

    <script>

    </script>
</section>
</html>
