<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{page-top-submenu.html}">

<section layout:fragment="side-bar">
	<div th:replace="usersubmenu :: usersubmenu"></div>
</section>

<section layout:fragment="main-content">

    <div class="row">
        <div th:each="res : ${reservations}" class="col capp-airport-block p-results-custom no-padding">
            <div class="row capp-card-row">
                <div class="col-sm-5 capp-card-label">Order Number</div>
                <div class="col-sm-7 capp-card-text" th:text="${res.orderNumber}"></div>
            </div>
            <div class="row capp-card-row">
                <div class="col-sm-5 capp-card-label">Order Date</div>
                <div class="col-sm-7 capp-card-text" th:text="${res.orderDate}"></div>
            </div>
            <div class="row capp-card-row">
                <div class="col-sm-5 capp-card-label">Type</div>
                <div class="col-sm-7 capp-card-text" th:text="${res.bookingType}"></div>
            </div>
            <div class="row capp-card-row">
                <div class="col-sm-5 capp-card-label">Departing Airport</div>
                <div class="col-sm-7 capp-card-text" th:text="${res.departingAirport}"></div>
            </div>
            <div class="row capp-card-row">
                <div class="col-sm-5 capp-card-label">Drop Location</div>
                <div class="col-sm-7 capp-card-text" th:text="${res.dropLocation}"></div>
            </div>
            <div class="row">
                <div class="col-sm-5 capp-card-label">Reservation Status</div>
                <div class="col-sm-7 capp-card-text" th:text="${res.reservationStatus}"></div>
            </div>
            <div class="ba-button-div"><a th:href="${res.detailLink}"><span class="capp-card-label">Details </span><img src="/images/left-arrow-green.png" class="ba-button-image"/></a></div>
        </div>
    </div>
