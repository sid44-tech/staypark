<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{page-right-nav.html}">

<section layout:fragment="page-right-nav-content">
	<span class="section-title">Browse Airport Parking</span>
	<div class="ba-state-block" th:each="stateAirport : ${stateAirports}">
		<img class="airplane-icon" src="/images/airport_icon_md.png">
		<span class="ba-state-title" th:text="${stateAirport.state}"></span>
		<div class="ba-airport-block" th:each="airport : ${stateAirport.airports}">
			<a th:href="${airport.link}">
			<span class="ba-airport-title"><span th:text="${airport.name}"></span> (<span th:text="${airport.code}"></span>)</span>
			<br>
			<span class="ba-airport-text" th:text="${airport.simpleText}"></span>
			</a>
		</div>
	</div>
</section>
</html>
