<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{page.html}">

<section layout:fragment="page-content">
	<form class="needs-validation" novalidate action="#" th:action="@{/forgot}" th:object="${user}" method="post">
		<div class="form-div-container login-container">
			<div class="form-div-container-header">RESET PASSWORD</div>
			<div class="form-div-container-body">
				<div class="form-row">
					<div th:if="${error != ''}" id="error" class="col login-error" th:text="${error}"></div>
				</div>
				<div class="form-row">
					<div class="form-group col-md">
						<label for="email">Email *</label>
						<input type="text" class="form-control" id="email" name="email" required/>
					</div>
				</div>
				<div class="form-group row ur-submit">
					<div class="col">
						<button type="submit" class="btn btn-primary">Submit</button>
					</div>
					<div class="col align-right login-links-custom">

					</div>
				</div>
			</div>
		</div>
	</form>
</section>
</html>
