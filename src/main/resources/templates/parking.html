<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{page-right-nav.html}">

<section layout:fragment="page-right-nav-content">
	<div class="form-group row">
		<div class="col">
		    <label for="sort" class="col-form-label p-results-sort-text">Sort By</label>
		    <div>
				<select class="form-control" id="sort" onchange="updateSort(this)">
					<option value="REC" th:selected="${sort == 'REC'}">Recommended</option>
					<option value="PLH" th:selected="${sort == 'PLH'}">Price Lowest to Highest</option>
					<option value="PHL" th:selected="${sort == 'PHL'}">Price Highest to Lowest</option>
					<option value="DSL" th:selected="${sort == 'DSL'}">Distance Shortest to Longest</option>
					<option value="DLS" th:selected="${sort == 'DLS'}">Distance Longest to Shortest</option>
				</select>
		    </div>
	    </div>
  	</div>
	<div class="row">
		<div class="card col-sm p-results-custom no-padding" th:each="hotel : ${hotels}">
			<img class="card-img-top p-results-card-img-top" th:src="${hotel.logoImage}" alt="Card image cap">
			<div class="p-results-header-image-cover"></div>
			<div class="card-body p-results-cardbody-font">
				<div class="row p-results-moneymargin">
					<div class="col p-results-cardbody-cost-font">
						<span th:text="${hotel.totalCost}"></span> <span th:text="${hotel.currencyType}"></span>
					</div>
					<div class="col align-right">
						<div th:if="${hotel.minimumDaysEnabled == true}">
							<button th:id="${hotel.hotelId}" class="btn btn-sm btn-disabled" type="button" aria-expanded="false" disabled="true">BOOK NOW</button>
						</div>
						<div th:if="${hotel.minimumDaysEnabled == false}">
							<div th:switch="${hotel.soldout}">
								<button th:id="${hotel.hotelId}" class="btn btn-success btn-sm" type="button" aria-expanded="false" th:case="${false}" onclick="checkout(this)">BOOK NOW</button>
								<button class="btn btn-danger btn-sm" type="button" aria-expanded="false" th:case="${true}" disabled>SOLD OUT</button>
							</div>
						</div>
					</div>
				</div>
				<div th:if="${hotel.minimumDaysEnabled == true}">
					<div class="p-results-min-days-container row">
						<div class='col'>
							<span class="p-results-min-days" th:text="${hotel.minimumDaysMessage}"></span>
						</div>
					</div>
				</div>
				<div class="row">
					<div class="col">
						<span class="p-results-card-label" th:text="${hotel.hotelTitle}"></span>
						<br><br>
						<span class="p-results-card-label">Distance: <span class="p-results-card-text" th:text="${hotel.airportDistance}"></span><span class="p-results-card-text"> miles</span></span>
						<br><br>
						<span class="p-results-card-label">Shuttle Frequency: <span class="p-results-card-text" th:text="${hotel.shuttleFrequency}"></span></span>
						<br><br>
						<div class="row">
							<img data-toggle="modal" data-target="#p_results_image_modal" onclick="showModal(this)" th:each="il : ${hotel.parkingImageLinks}" th:src="${il.smallImageLink}" class="col p-results-image"/>
						</div>
						<div class="p-results-map-div">
							<button class="btn btn-info btn-sm" type="button" aria-expanded="false" th:onclick="'javascript:viewmap(' + ${hotel.latitude} + ', ' + ${hotel.longitude} + ')'">VIEW MAP</button>
						</div>
						<div id="expand_button" onclick="updateExpand(this)" class="p-results-expand pointer p-results-toggle-custom" data-toggle="collapse" th:attr="data-target='#parking-description' + ${hotel.hotelId}" aria-expanded="false" aria-controls="collapseExample">
							Show More Details
						</div>
						<div class="collapse" th:id="'parking-description' + ${hotel.hotelId}">
							<br>
							<span th:utext="${hotel.parkingDescription}"></span>
						</div>
					</div>
				</div>
			</div>
		</div>

		<div id="p_results_image_modal" class="modal fade p_results_modal_shadow" role="dialog">
			<div class="modal-dialog modal-dialog-centered">
				<div class="modal-content p_results_modal_content">
					<div class="modal-body align-center">
						<img id="p_results_large_image" src=""/>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
        function showModal(e) {
            var link = e.src;
            link = link.replace("thumb_", "");
            $("#p_results_large_image").attr("src",link);
        }

        function updateExpand(e) {
            var html = e.textContent;

            if (html.indexOf("Show") != -1) {
                e.innerHTML = "Hide Details";
            } else {
                e.innerHTML = "Show More Details";
            }
        }
        
        function updateSort(item) {
        	var parms = location.href.split("?")[1].split("&");
        	var parmsStr = "";
			var sortFound = false;
        	for (i = 0; i < parms.length; i++) {
        		if (parms[i].indexOf("sort") != -1) {
        			parmsStr = parmsStr + "sort=" + item.value + "&";
        			sortFound = true;
        		} else {
        			parmsStr = parmsStr + parms[i] + "&";
        		}
        	}

        	if (sortFound) {
            	var url = location.href.split("?")[0] + "?" + parmsStr;
        	} else {
        		var url = location.href + "&sort=" + item.value;
        	}

        	location.href = url;
        }
        
        function checkout(e) {
            var url = "/parking/checkout/" + e.id + location.search;
        	location.href = url;
        }
        
		function viewmap(lat, lon) {
        	window.open('http://www.google.com/maps/place/' + lat + ',' + lon, '_blank');
        }
	</script>
</section>



</html>
