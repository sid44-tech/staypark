<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{page-right-nav.html}">

<section layout:fragment="page-right-nav-content">
	<div class="row">
		<div class="card p-results-custom col-sm no-padding" th:each="hotel : ${hotels}">
			<img class="card-img-top p-results-card-img-top" th:src="${hotel.logoImage}" alt="Card image cap">
			<div class="card-img-overlay p-results-card-img-text d-flex flex-column justify-content-end" th:text="${hotel.hotelTitle}">
			</div>
			<div class="card-body p-results-cardbody-font">
				<div class="row p-results-moneymargin">
					<div class="col p-results-cardbody-cost-font">
						<span th:text="${hotel.totalCost}"></span> <span th:text="${hotel.currencyType}"></span>
					</div>
					<div class="col align-right">
						<div th:switch="${hotel.soldout}">
							<button class="btn btn-success btn-sm" type="button" aria-expanded="false" th:case="${false}">BOOK NOW</button>
							<button class="btn btn-danger btn-sm" type="button" aria-expanded="false" th:case="${true}">SOLD OUT</button>
						</div>
					</div>
				</div>
				<div class="row">
					<div class="col">
						<span class="p-results-card-label">Distance: <span class="p-results-card-text" th:text="${hotel.airportDistance}"></span></span>
						<br><br>
						<span class="p-results-card-label">Shuttle Frequency: <span class="p-results-card-text" th:text="${hotel.shuttleFrequency}"></span></span>
						<br><br>
						<div id="expand_button" onclick="updateExpand()" class="p-results-expand" data-toggle="collapse" th:attr="data-target='#parking-description' + ${hotel.hotelId}" aria-expanded="false" aria-controls="collapseExample">
							Show Details <img class="p-results-expand-icon" src="/images/collapse_icon.png"/>
						</div>
						<div class="collapse" th:id="'parking-description' + ${hotel.hotelId}">
							<br>
							<span th:utext="${hotel.parkingDescription}"></span>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>

<script>
----------------------------WTF
	function updateExpand() {
	    var html = $('#total_parking_time').innerText;

		if (html.lastIndexOf("Show", 0) === 0) {
            $('#total_parking_time').innerHTML = "Hide Details <img class='p-results-expand-icon' src='/images/collapse_icon.png'/>";
		} else {
            $('#total_parking_time').innerHTML = "Show Details <img class='p-results-collapse-icon' src='/images/collapse_icon.png'/>";
		}
	}

</script>

</html>
