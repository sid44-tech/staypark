<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{page.html}">

<section layout:fragment="page-content">
	<form class="needs-validation" novalidate action="#" th:action="@{/login}" th:object="${user}" method="post">
		<div class="form-div-container login-container">
			<div class="form-div-container-header">LOGIN</div>
			<div class="form-div-container-body">
				<div class="form-row">
					<div class="form-group col-md">
						<label for="username">Username *</label>
						<input type="text" class="form-control" id="username" name="username" onfocusout="checkUsernameExists(this)" required/>
					</div>
				</div>
				<div class="form-row">
					<div class="form-group col-md">
						<label for="password">Password *</label>
						<input type="password" class="form-control" id="password" name="password" required/>
					</div>
				</div>
				<div class="form-group row ur-submit">
					<div class="col">
						<button type="submit" class="btn btn-primary">Login</button>
					</div>
					<div class="col align-right login-links-custom">
						<div class="small-row"><a href="\forgot" class="login-small-font">Forgot Password?</a></div>
						<div class="small-row"><a href="\signup" class="login-small-font">Sign-up</a></div>
					</div>
				</div>
			</div>
		</div>
	</form>
</section>
</html>
