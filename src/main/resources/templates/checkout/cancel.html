<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{page.html}">

<section layout:fragment="page-content">
    <form id="cancelForm" class="needs-validation" novalidate action="#" th:action="@{/parking/cancel}" th:object="${res}" method="post">
        <div class="form-div-container">
            <div class="form-div-container-header">Cancel Reservation</div>
            <div class="form-div-container-body">
                <div id="cancel">
                    <div class="row">
                        <div th:class="${res.messageClass}" th:text="${message}"></div>
                    </div>
                    <div class="form-row change-margin-top change-section-title">Cancel Parking</div>
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="cancelReservationNumber">Reservation Number *</label>
                            <input type="number" class="form-control" id="cancelReservationNumber" name="cancelReservationNumber" default="" th:field="*{cancelReservationNumber}" required/>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="lastDigits">Last 4 digits of card used for booking *</label>
                            <input type="number" class="form-control" id="lastDigits" name="lastDigits" default="" th:field="*{lastDigits}" required/>
                        </div>
                    </div>
                    <div class="form-group row">
                        <div class="col-sm-9">
                            <button type="button" class="btn btn-primary" onclick="checkReservation()">Check Reservation</button>
                        </div>
                    </div>
                </div>
                <div id="info" class="gone">
                    <div class="form-row change-margin-top change-section-title">Reservation Information</div>
                    <div class="row pb-label-row">
                        <div class="col-sm-2 label-row-margin">
                            <div class="row">
                                <div class="col pb-label-label-font">Name</div>
                            </div>
                            <div class="row">
                                <div id="firstName" class="col pb-text-font" th:text="${res.name}"></div>
                            </div>
                        </div>
                        <div class="col-sm-3 label-row-margin">
                            <div class="row">
                                <div class="col pb-label-label-font">Departing Airport</div>
                            </div>
                            <div class="row">
                                <div id="departAirport" class="col pb-text-font" th:text="${res.departingAirport}"></div>
                            </div>
                        </div>
                        <div class="col-sm-2 label-row-margin">
                            <div class="row">
                                <div class="col pb-label-label-font">Location</div>
                            </div>
                            <div class="row">
                                <div id="departLocation" class="col pb-text-font" th:text="${res.dropOffLocation}"></div>
                            </div>
                        </div>
                        <div class="col-sm-5 label-row-margin">
                            <div class="row">
                                <div class="col pb-label-label-font">Address</div>
                            </div>
                            <div class="row">
                                <div class="col pb-text-font" th:text="${res.address}"></div>
                            </div>
                        </div>
                    </div>
                    <div class="row pb-label-row">
                        <div class="col-sm-4 label-row-margin">
                            <div class="row">
                                <div class="col pb-label-label-font">Drop Off Time</div>
                            </div>
                            <div class="row">
                                <div id="dropOffTime" class="col pb-text-font" th:text="${res.dropOffTime}"></div>
                            </div>
                        </div>
                        <div class="col-sm-4 label-row-margin">
                            <div class="row">
                                <div class="col pb-label-label-font">Pick Up Time</div>
                            </div>
                            <div class="row">
                                <div id="pickUpTime" class="col pb-text-font" th:text="${res.pickUpTime}"></div>
                            </div>
                        </div>
                    </div>
                    <div class="row pb-label-row">
                        <div th:if="${res.baseFee != ''}" class="col-sm-2 label-row-margin">
                            <div class="row">
                                <div class="col pb-label-label-font">Base Fee</div>
                            </div>
                            <div class="row">
                                <div class="col pb-text-font" th:text="${res.baseFee}"></div>
                            </div>
                        </div>
                        <div th:if="${res.serviceFee != ''}" class="col-sm-2 label-row-margin">
                            <div class="row">
                                <div class="col pb-label-label-font">Service Fee</div>
                            </div>
                            <div class="row">
                                <div class="col pb-text-font" th:text="${res.serviceFee}"></div>
                            </div>
                        </div>
                        <div th:if="${res.acFee != ''}" class="col-sm-2 label-row-margin">
                            <div class="row">
                                <div class="col pb-label-label-font">AC Fee</div>
                            </div>
                            <div class="row">
                                <div class="col pb-text-font" th:text="${res.acFee}"></div>
                            </div>
                        </div>
                        <div th:if="${res.salesTax != ''}" class="col-sm-2 label-row-margin">
                            <div class="row">
                                <div class="col pb-label-label-font">Sales Tax</div>
                            </div>
                            <div class="row">
                                <div class="col pb-text-font" th:text="${res.salesTax}"></div>
                            </div>
                        </div>
                        <div th:if="${res.discount != ''}" class="col-sm-2 label-row-margin">
                            <div class="row">
                                <div class="col pb-label-label-font">Discount</div>
                            </div>
                            <div class="row">
                                <div class="col pb-text-font" th:text="${res.discount}"></div>
                            </div>
                        </div>
                        <div th:if="${res.grandTotal != ''}" class="col-sm-2 label-row-margin">
                            <div class="row">
                                <div class="col pb-label-label-font">Grand Hotel</div>
                            </div>
                            <div class="row">
                                <div class="col pb-text-font" th:text="${res.grandTotal}"></div>
                            </div>
                        </div>
                        <div th:if="${res.paymentDueNow != ''}" class="col-sm-2 label-row-margin">
                            <div class="row">
                                <div class="col pb-label-label-font">Payment Due Now</div>
                            </div>
                            <div class="row">
                                <div class="col pb-text-font" th:text="${res.paymentDueNow}"></div>
                            </div>
                        </div>
                        <div th:if="${res.paymentDueAtLot != ''}" class="col-sm-2 label-row-margin">
                            <div class="row">
                                <div class="col pb-label-label-font">Payment Due At Lot</div>
                            </div>
                            <div class="row">
                                <div class="col pb-text-font" th:text="${res.paymentDueAtLot}"></div>
                            </div>
                        </div>
                    </div>
                    <div class="row pb-label-row">
                        <div class="col-sm-4">
                            <button type="submit" class="btn critical-button">Cancel Reservation</button>
                        </div>
                    </div>
                </div>
                <input id="type" name="type" type="hidden" value="C">
            </div>
        </div>
    </form>

    <script th:inline="javascript">
        /*<![CDATA[*/
        (function() {
            'use strict';
            window.addEventListener('load', function() {
                var message = /*[[${message}]]*/;
                if (message != "")  {
                    $("#info").hide();
                } else {
                    $("#info").show();
                }
            }, false);
        })();
        /*]]>*/
    </script>

    <script>
        function checkReservation() {
            var cres = document.getElementById("cancelReservationNumber");
            if (!cres.checkValidity()) {
                cres.style.borderColor = "#dc3545";
            } else {
                cres.style.borderColor = "#ced4da";
            }

            var ld = document.getElementById("lastDigits");
            if (!ld.checkValidity()) {
                ld.style.borderColor = "#dc3545";
            } else {
                ld.style.borderColor = "#ced4da";
            }

            if (ld.checkValidity() && cres.checkValidity()) {
                location.href = "/parking/cancel?cancelReservationNumber=" + $("#cancelReservationNumber").val() + "&lastDigits=" + $("#lastDigits").val();
            }
        }
    </script>
</section>
</html>
