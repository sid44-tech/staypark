<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{page.html}">

<section layout:fragment="page-content">
    <div class="form-div-container">
        <div class="form-div-container-header">Reservation Change</div>
        <div class="form-div-container-body">
            <span class="about-instruction-font">
                Would you like to <span class="clickable-text" onclick="handleCancelClick()">cancel</span> or <span class="clickable-text" onclick="handleExtendClick()">extend</span> your parking?
            </span>
        </div>
    </div>

    <script>
        function handleCancelClick() {
            location.href = "/parking/cancel";
        }

        function handleExtendClick() {
            location.href = "/parking/extend";
        }
    </script>
</section>
</html>
