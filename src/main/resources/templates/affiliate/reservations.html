<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{page-top-submenu.html}">

<section layout:fragment="side-bar">
    <div th:replace="affiliatesubmenu :: affiliatesubmenu"></div>
</section>

<section layout:fragment="main-content">
    <div class="form-row">
        <div class="col-md-auto section-title res-field-c-margin"><span class="section-title res-time-label">MY RESERVATIONS</span></div>
        <div class="col-md-3 res-field-c-margin">
            <select class="form-control" id="timeWindow" name="timeWindow" onchange="onTimeChange(this)">
                <option value="TODAY" th:selected="${range} == 'TODAY'">Today</option>
                <option value="YESTERDAY" th:selected="${range} == 'YESTERDAY'">Yesterday</option>
                <option value="PREVIOUS_WEEK" th:selected="${range} == 'PREVIOUS_WEEK'">Previous Week</option>
                <option value="PREVIOUS_MONTH" th:selected="${range} == 'PREVIOUS_MONTH'">Previous Month</option>
                <option value="PREVIOUS_6_MONTHS" th:selected="${range} == 'PREVIOUS_6_MONTHS'">Previous 6 Months</option>
                <option value="SELECT" th:selected="${range} == 'SELECT'">(Select Date Range)</option>
            </select>
        </div>
        <div id="startDateDiv" class="col-md-2 gone res-field-c-margin">
            <input type="text" class="form-control" id="startDate" name="startDate" placeholder="Start Date" required/>
        </div>
        <div id="endDateDiv" class="col-md-2 gone res-field-c-margin">
            <input type="text" class="form-control" id="endDate" name="endDate" placeholder="End Date" required/>
        </div>
        <div id="goDiv" class="col-md-1 gone res-field-c-margin">
            <button type="button" class="form-control btn btn-success" id="go" name="go" onclick="updateDateSelection()">Go</button>
        </div>
    </div>
    <br>
    <div class="form-row">
        <div class="col-md-auto section-title"><span class="section-title res-time-label" th:text="${resCount}"></span></div>
    </div>
    <div class="table-responsive">
        <table class="table res-table-bg">
            <thead class="thead-dark">
            <tr>
                <th scope="col-auto">Reservation Date</th>
                <th scope="col">Order #</th>
                <th scope="col">Name</th>
                <th scope="col">Email</th>
                <th scope="col">Payment</th>
                <th scope="col">Type</th>
            </tr>
            </thead>
            <tbody>
                <tr th:each="reservation : ${res}">
                    <td th:text="${reservation.date}"></td>
                    <td><a th:href="'reservations/' + ${reservation.order}" th:text="${reservation.order}"></a></td>
                    <td th:text="${reservation.name}"></td>
                    <td th:text="${reservation.email}"></td>
                    <td th:text="${reservation.payment}"></td>
                    <td th:text="${reservation.type}"></td>
                </tr>
            </tbody>
        </table>
    </div>
    <script>
        (function() {
            'use strict';
            window.addEventListener('load', function() {
                var startDate=$('input[name="startDate"]'); //our date input has the name "date"

                startDate.datepicker({
                    format: 'mm/dd/yyyy',
                    todayHighlight: true,
                    autoclose: true,
                    disableTouchKeyboard: true,
                    clearBtn: true,
                    startDate: new Date()
                })
                startDate.val(todayString());
                startDate.datepicker("setDate", new Date());

                var endDate=$('input[name="endDate"]'); //our date input has the name "date"
                endDate.datepicker({
                    format: 'mm/dd/yyyy',
                    todayHighlight: true,
                    autoclose: true,
                    disableTouchKeyboard: true,
                    clearBtn: true,
                    startDate: new Date()
                })
                endDate.val(tomorrowString());
                endDate.datepicker("setDate", tomorrow());

                addListenersForDateField(startDate, endDate);
            }, false);
        })();

        function addListenersForDateField(startDate, endDate) {
            startDate.on('changeDate', function() {
                var dDate = startDate.datepicker("getDate");
                var pDate = endDate.datepicker("getDate");

                if (dDate >= pDate) {
                    pDate.setDate(dDate.getDate() + 1);
                    endDate.datepicker("setDate", pDate);
                }
            });

            endDate.on('changeDate', function() {
                var dDate = startDate.datepicker("getDate");
                var pDate = endDate.datepicker("getDate");

                if (dDate >= pDate) {
                    dDate.setDate(pDate.getDate() - 1);
                    startDate.datepicker("setDate", dDate);
                }
            });
        }

        function onTimeChange(e) {
            if (e.value == "SELECT") {
                $("#startDateDiv").show();
                $("#endDateDiv").show();
                $("#goDiv").show();
            } else {
                location.href = "/affiliate/reservations?range=" + e.value;
            }
        }

        function updateDateSelection() {
            var d1 = $('#startDate').val();
            var d2 = $('#endDate').val();
            var sDate = $('input[name="startDate"]').datepicker("getDate");
            var eDate = $('input[name="endDate"]').datepicker("getDate");
            var dd = daysDifference(sDate, eDate) + 1;
            if (dd > 180) {
                alert('Date range search is limited to 6 months');
                return;
            }

            var url = "/affiliate/reservations?range=SELECT&startDate=" + d1.replace("/", "-").replace("/", "-") + "&endDate=" + d2.replace("/", "-").replace("/", "-");
            location.href = url;
        }
    </script>
</section>
</html>
