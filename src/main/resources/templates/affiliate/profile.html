<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{page-top-submenu.html}">

<section layout:fragment="side-bar">
    <div th:replace="affiliatesubmenu :: affiliatesubmenu"></div>
</section>

<section layout:fragment="main-content">
    <form class="needs-validation" novalidate action="/affiliate/profile" th:action="@{/affiliate/profile}" th:object="${profile}" method="post">
        <div class="form-div-container">
            <div class="form-div-container-header">Profile</div>
            <div class="form-div-container-body">
                <div class="form-group row">
                    <label for="fname" class="col-sm-4 col-form-label">Company Name *</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" id="companyName" name="companyName" th:field="*{companyName}" placeholder="" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="lname" class="col-sm-4 col-form-label">Contact Name *</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" id="contactName" name="contactName" th:field="*{contactName}" placeholder="" maxlength="12" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="phone" class="col-sm-4 col-form-label">Phone Number *</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" id="phone" name="phone" th:field="*{phone}" placeholder="" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="email" class="col-sm-4 col-form-label">Email *</label>
                    <div class="col-sm-8">
                        <input type="email" class="form-control" id="email" name="email" th:field="*{email}" placeholder="" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="address" class="col-sm-4 col-form-label">Tell Us About Your Company *</label>
                    <div class="col-sm-8">
                    	<textarea class="form-control" id="companyInfo" name="companyInfo" th:field="*{companyInfo}" rows="6" required></textarea>
                    </div>
                </div>
                <div class="form-group row">
                    <div class="col-sm-9">
                        <button type="submit" class="btn btn-primary">Update</button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</section>
</html>
