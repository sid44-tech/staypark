<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{page-top-submenu.html}">

<section layout:fragment="side-bar">
    <div th:replace="affiliatesubmenu :: affiliatesubmenu"></div>
</section>

<section layout:fragment="main-content">
    <div class="row">
        <div class="col-md-auto area-title fr-rooms-padding">ROOMS</div>
    </div>
    <br>
    <div class="table-responsive">
        <table class="table res-table-bg">
            <thead class="thead-dark">
            <tr>
                <th scope="col-auto">Type</th>
                <th scope="col">Cost</th>
                <th scope="col">Status</th>
            </tr>
            </thead>
            <tbody class="res-table-bg">
                <tr th:each="room : ${rooms}">
                    <td th:text="${room.type}"></td>
                    <td th:text="${room.cost}"></td>
                    <td th:text="${room.status}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
</html>
