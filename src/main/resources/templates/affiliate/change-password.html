<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{page-top-submenu.html}">

<section layout:fragment="side-bar">
    <div th:replace="affiliatesubmenu :: affiliatesubmenu"></div>
</section>

<section layout:fragment="main-content">
    <form class="needs-validation" novalidate action="#" th:action="@{/user/password}" th:object="${pw}" method="post" onsubmit="return validateForm()">
        <div class="form-div-container login-container">
            <div class="form-div-container-header">CHANGE PASSWORD</div>
            <div class="form-div-container-body">
                <div class="form-row">
                    <div th:switch="${message}" class="col-md">
                        <div th:case="'success'" class="cp-message-custom-success">Password Successfully Updated</div>
                        <div th:case="'error'" class="cp-message-custom-error">Error Updating Password</div>
                        <div th:case="*"></div>
                    </div>
                    <div id="message" class="col login-error">
                        Username or Password is Incorrect
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md">
                        <label for="current-password">Current Password *</label>
                        <input type="password" class="form-control" id="current-password" name="currentPassword" autocomplete="off" required/>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md">
                        <label for="new-password">New Password *</label>
                        <input type="password" class="form-control" id="new-password" name="newPassword" autocomplete="off" required/>
                        <div id="password_feedback" class="invalid-feedback"></div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md">
                        <label for="confirm-password">Confirm Password *</label>
                        <input type="password" class="form-control" id="confirm-password" name="confirmPassword" autocomplete="off" required/>
                    </div>
                </div>
                <div class="form-group row ur-submit">
                    <div class="col">
                        <button type="submit" class="btn btn-primary">Change Password</button>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <script>
        (function() {
            'use strict';
            window.addEventListener('load', function() {
                var link = location.href;
                if (link.indexOf("error") != -1) {
                    $("#error").show();
                } else {
                    $("#error").hide();
                }
            }, false);
        })();

        function validateForm() {
            var p = $('#new-password').val();
            var cp = $('#confirm-password').val();

            var passwordValid = validatePassword(p);
            var passwordsMatch = validateConfirmPassword(p, cp);

            if (passwordValid && passwordsMatch) {
                $('#password_feedback').html("")
                $('#password_feedback').hide();
                return true;
            } else if (!passwordValid) {
                $('#password_feedback').html("Password must be 8 characters and contain at least 1 number.");
                $('#password_feedback').show();
            } else if (!passwordsMatch) {
                $('#password_feedback').html("Password and Confirm Password do not match.");
                $('#password_feedback').show();
            }

            return false;
        }
    </script>
</section>
</html>
