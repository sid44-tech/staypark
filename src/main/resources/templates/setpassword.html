<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{page-top-submenu.html}">
<section layout:fragment="main-content">
    <form class="needs-validation" novalidate action="#" th:action="@{/setpassword}" th:object="${user}" method="post" onsubmit="return validateForm()">
        <div class="form-div-container login-container">
            <div class="form-div-container-header">CHANGE YOUR PASSWORD</div>
            <div class="form-div-container-body">
                <div class="form-row">
                    <div th:switch="${message}" class="col-md">
                        <div th:case="'success'" class="cp-message-custom-success">Password Successfully Updated</div>
                        <div th:case="'error'" class="cp-message-custom-error">Error Updating Password</div>
                        <div th:case="*" th:text="${message}" class="cp-message-custom-error"></div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md">
                        <label for="new-password">New Password *</label>
                        <input type="password" class="form-control" id="new-password" name="password" autocomplete="off" required/>
                        <div id="password_feedback" class="invalid-feedback"></div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md">
                        <label for="confirm-password">Confirm Password *</label>
                        <input type="password" class="form-control" id="confirm-password" name="confirmPassword" autocomplete="off" required/>
                    </div>
                </div>
                <input type="hidden" id="req" name="req"/>
                <div class="form-group row ur-submit">
                    <div class="col">
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <script>
        (function() {
            'use strict';
            window.addEventListener('load', function() {
                var parm = getToken(location.search.substring(1))

                $('#req').val(parm);

            }, false);
        })();

        function validateForm() {
            var p = $('#new-password').val();
            var cp = $('#confirm-password').val();

            var passwordValid = validatePassword(p);
            var passwordsMatch = validateConfirmPassword(p, cp);

            if (passwordValid && passwordsMatch) {
                $('#password_feedback').html("")
                $('#password_feedback').hide();
                return true;
            } else if (!passwordValid) {
                $('#password_feedback').html("Password must be 8 characters and contain at least 1 number.");
                $('#password_feedback').show();
            } else if (!passwordsMatch) {
                $('#password_feedback').html("Password and Confirm Password do not match.");
                $('#password_feedback').show();
            }

            return false;
        }

        function getToken(parms) {
            var index = parms.indexOf("req=");
            if (index == -1) {
                return "";
            }
            return parms.substring(4);
        }
    </script>
</section>
</html>
