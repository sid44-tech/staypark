<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{page-right-nav.html}">

<section layout:fragment="page-right-nav-content">
	<div th:switch="${success}">
		<span th:case="'true'" class="green-normal-font"><br><br><br>Thank you for registering with StayPark.com!  <a href="/login">Click here to login.</a><br><br><br></span>
		<div th:case="'false'">
			<span class="section-title">New User Registration</span>
			<form class="needs-validation" enctype="multipart/form-data" novalidate action="#" th:action="@{/signup}" th:object="${user}" method="post" onsubmit="return validateForm()">
				<div class="form-div-container">
					<div class="form-div-container-header">User Information</div>
					<div class="form-div-container-body">
						<div class="form-row">
							<div class="form-group col-md-6">
								<label for="username">Username *</label>
								<input type="text" class="form-control" id="username" name="username" onfocusout="checkUsernameExists(this)" required/>
							</div>
							<div class="form-group col-md-6">
								<label for="email">Email Address *</label>
								<input type="email" class="form-control" id="email" name="email" onfocusout="checkEmailExists(this)" required/>
							</div>
						</div>
						<div class="form-row">
							<div class="form-group col-md-6">
								<label for="password">Password *</label>
								<input type="password" class="form-control" id="password" name="password" autocomplete="off" required/>
								<small id="passwordHelp" class="form-text text-muted">Minimum 8 characters and 1 number</small>
								<div id="password_feedback" class="invalid-feedback">

								</div>
							</div>
							<div class="form-group col-md-6">
								<label for="confirm">Confirm Password *</label>
								<input type="password" class="form-control" id="confirm" name="confirm" autocomplete="off" required/>
							</div>
						</div>
						<div class="form-row">
							<div class="form-group col-md-6">
								<label for="firstName">First Name*</label>
								<input type="text" class="form-control" id="firstName" name="firstName" required/>
							</div>
							<div class="form-group col-md-6">
								<label for="lastName">Last Name *</label>
								<input type="text" class="form-control" id="lastName" name="lastName" required/>
							</div>
						</div>
						<div class="form-row">
							<div class="form-group col-md-4">
								<label for="city">City *</label>
								<input type="text" class="form-control" id="city" name="city" required/>
							</div>
							<div class="form-group col-md-4">
								<label for="state">State *</label>
								<input type="text" class="form-control" id="state" name="state" required/>
							</div>
							<div class="form-group col-md-4">
								<label for="zip">Zip *</label>
								<input type="text" class="form-control" id="zip" name="zip" required/>
							</div>
						</div>
						<div class="form-row">
							<div class="form-group col-md-12">
								<label for="address">Address *</label>
								<input type="text" class="form-control" id="address" name="address" required/>
							</div>
						</div>
						<div class="form-row">
							<div class="form-group col-md-6">
								<label for="phone">Phone Number *</label>
								<input type="number" class="form-control" id="phone" name="phone" required/>
							</div>
						</div>
						<div class="form-check form-row ur-terms">
							<input class="form-check-input" type="checkbox" value="" id="termsAgree" required>
							<label class="form-check-label" for="termsAgree">I agree to <a href="/tac" target="_blank">Terms & Conditions</a></label>
						</div>
					</div>
				</div>
				<div th:if="${captchaFailed == 'true'}" class="row captcha-submit-margin">
					<div class="col error-font">
						Captcha Check Failed
					</div>
				</div>
				<div class="g-recaptcha captcha-submit-margin" data-sitekey="6LcNiXYUAAAAAM6xZU6HfncLMFXAmDUG9xl3Bzwn"></div>
				<div class="form-group row ur-submit">
					<div class="col-sm-9">
						<button type="submit" class="btn btn-primary">Sign Up</button>
					</div>
				</div>
			</form>
		</div>
	</div>

	<br>

	<script>
        function checkEmailExists(e) {
            if (e.value != "") {
                var xhttp = new XMLHttpRequest();
                xhttp.onreadystatechange = function () {
                    if (this.readyState == 4 && this.status == 200) {
                        var input = $('#email');
                        var data = this.responseText;
                        if (data == "true") {
                            e.value = "";
                            alert("Email is already in use.");
                        }
                    }
                };
                xhttp.open("GET", "/account/email/" + e.value + "/check", true);
                xhttp.send();
            }
        }

        function checkUsernameExists(e) {
            if (e.value != "") {
                var xhttp = new XMLHttpRequest();
                xhttp.onreadystatechange = function () {
                    if (this.readyState == 4 && this.status == 200) {
                        var input = $('#username');
                        var data = this.responseText;
                        if (data == "true") {
                            e.value = "";
                            alert("Username is already in use.");
                        }
                    }
                };
                xhttp.open("GET", "/account/username/" + e.value + "/check", true);
                xhttp.send();
            }
        }

        function validateForm() {
            var p = $('#password').val();
            var cp = $('#confirm').val();

            var passwordValid = validatePassword(p);
            var passwordsMatch = validateConfirmPassword(p, cp);

            if (passwordValid && passwordsMatch) {
                $('#password_feedback').html("")
                $('#password_feedback').hide();
                return true;
            } else if (!passwordValid) {
                $('#password_feedback').html("Password must be 8 characters and contain at least 1 number.");
                $('#password_feedback').show();
            } else if (!passwordsMatch) {
                $('#password_feedback').html("Password and Confirm Password do not match.");
                $('#password_feedback').show();
            }

            return false;
        }
	</script>
</section>

</html>
